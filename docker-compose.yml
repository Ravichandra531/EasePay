name: easepay
x-runtime: &runtime
  DATABASE_URL: ${DATABASE_URL:-postgresql://easepay:easepay-local-only@db:5432/easepay}
  NEXTAUTH_URL: ${APP_URL:-http://localhost:3001}
  APP_URL: ${APP_URL:-http://localhost:3001}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run node scripts/setup-docker.mjs first}
  OTP_SECRET: ${OTP_SECRET:?Run node scripts/setup-docker.mjs first}
  BANK_ACCOUNT_ENCRYPTION_KEY: ${BANK_ACCOUNT_ENCRYPTION_KEY:?Run node scripts/setup-docker.mjs first}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Run node scripts/setup-docker.mjs first}
  PAYMENT_PROVIDER: sandbox
  BANK_SANDBOX_ENABLED: "true"
  LIVE_PAYMENTS_ENABLED: "false"
  OTP_PROVIDER: twilio
  ALLOW_DEV_OTP: "false"
  TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
  TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: easepay
      POSTGRES_PASSWORD: easepay-local-only
      POSTGRES_DB: easepay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easepay -d easepay"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migrate
    environment: *runtime
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      target: web
    environment: *runtime
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped
  webhook:
    build:
      context: .
      target: webhook
    environment:
      <<: *runtime
      PORT: "3003"
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
